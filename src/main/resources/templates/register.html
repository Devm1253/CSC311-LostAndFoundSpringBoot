<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<main>
    <h1>Register</h1>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <form th:action="@{/register}" method="post">
        <p><label for="username">Username</label>
            <input id="username" name="username" type="text" th:value="${username}"
                   minlength="3" required autocomplete="username"></p>
        <p><label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="6" required autocomplete="new-password"></p>
        <button type="submit">Register</button>
    </form>
    <p><a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
